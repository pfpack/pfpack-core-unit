name: PrimeFuncPack Core.Unit

on:
  push:
    branches: [ main, dev, feature/*, fix/*, release/* ]

  release:
    types: [ published ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
      # dotnet-quality: 'preview' # When using preview versions
        dotnet-quality: 'ga' # General Availability

    # Create Local NuGet Source

    - name: Create Local NuGet Directory
      run: mkdir ~/nuget

    - name: Add Local Nuget Source
      run: dotnet nuget add source ~/nuget

    # Unit

    - name: Restore Solution
      run: dotnet restore ./Unit.slnx

    - name: Build Solution
      run: dotnet build ./Unit.slnx -c Release --no-restore

    - name: Pack Unit
      run: dotnet pack ./src/*/*/Unit.csproj -c Release --no-build --output ~/nuget

    - name: Run Unit.Tests.Old
      run: dotnet run --project ./src/*/*/Unit.Tests.Old.csproj -c Release --no-build

    - name: Run Unit.Tests
      run: dotnet run --project ./src/*/*/Unit.Tests.csproj -c Release --no-build

    # Push

    - name: Push Packages
      if: ${{ github.event_name == 'release' }}
      run: >
        dotnet nuget push "../../../nuget/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key ${{ secrets.NuGetSourcePassword }}
        --skip-duplicate
